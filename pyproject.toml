[project]
name = "churnlens"
version = "0.1.0"
description = "Reusable churn-analytics pipeline: leakage guard, models, cost-based threshold, SHAP segments."
requires-python = ">=3.12"

[tool.setuptools]
packages = ["churnlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
